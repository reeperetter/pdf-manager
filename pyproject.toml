[project]
name = "pdf-ocr-translator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deep-translator>=1.11.4",
    "easyocr>=1.7.2",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
]

[tool.uv]
# ВАЖЛИВО для tkinter-GUI: власні managed-білди Python від uv
# (python-build-standalone) лінкують Tcl/Tk БЕЗ Xft/fontconfig, через що
# кирилиця й нормальні шрифти в GUI ламаються. Тому для цього проєкту
# змушуємо uv завжди брати системний Python, у якого Tcl/Tk злінкований
# нормально.
python-preference = "only-system"