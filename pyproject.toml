[project]
name = "pdf-ocr-translator"
version = "1.0.0"
description = "OCR + офлайн-переклад PDF (Tesseract, NLLB-200, PyQt5)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ctranslate2>=4.0,<5",
    "langdetect>=1.0.9",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pdf2docx>=0.5.8",
    "opencv-python-headless>=4.9",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
    "pyqt5>=5.15.11",
    "pytesseract>=0.3.13",
    "sentencepiece>=0.2.0,<0.3",
    "python-docx>=1.1.0",
    "python-pptx>=1.0",
]
# opencv-python-headless/numpy (потрібні для "Виправляти викривлення
# сторінки") раніше були опційним extras "dewarp", щоб готова збірка
# лишалась легкою. Тепер це основні залежності: готовий exe/бінарник має
# містити ВСЕ одразу, без спливаючих вікон із "встановіть такий-то пакет".

[tool.uv]
# PyQt5-Qt5 перестав публікувати Windows-колеса після версії 5.15.2
# (усі новіші 5.15.x мають лише macOS/Linux-wheels) - без цього блоку uv
# бере найновішу версію під час резолюції і збірка падає на Windows з
# "doesn't have a source distribution or wheel for the current platform".
# Явно вказуємо, під які платформи має резолвитись проєкт (відповідає
# матриці .github/workflows/build.yml: windows-latest + ubuntu-22.04) -
# тоді uv сам підбере версії, сумісні з усіма ними одразу (для
# pyqt5-qt5 це означає відкат до 5.15.2 - останньої версії з
# Windows-колесами).
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# E/F - помилки й невикористані імпорти; без стилістичних придирок.
select = ["E", "F"]
ignore = ["E731", "E501", "E701", "E702", "E741"]
