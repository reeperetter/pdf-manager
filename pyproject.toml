[project]
name = "pdf-ocr-translator"
version = "1.0.0"
description = "OCR + переклад PDF (Tesseract, PyQt5, uk/ru/en)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deep-translator>=1.11.4",
    "googletrans==4.0.0rc1",
    "js2py>=0.74",
    "langdetect>=1.0.9",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
    "pyqt5>=5.15.11",
    "pytesseract>=0.3.13",
    "python-docx>=1.1.0",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
# Потрібно ЛИШЕ для опції "Виправляти викривлення (згин) сторінки" в GUI.
# Не входить в базові залежності - без цього extras програма лишається
# легкою для слабких ПК; опція просто буде показувати повідомлення про
# відсутній пакет, якщо її увімкнути без встановленого dewarp-екстра.
dewarp = ["opencv-python-headless>=4.9", "numpy>=1.26"]

[tool.uv]
# PyQt5-Qt5 перестав публікувати Windows-колеса після версії 5.15.2
# (усі новіші 5.15.x мають лише macOS/Linux-wheels) - без цього блоку uv
# бере найновішу версію під час резолюції і збірка падає на Windows з
# "doesn't have a source distribution or wheel for the current platform".
# Явно вказуємо, під які платформи має резолвитись проєкт (відповідає
# матриці .github/workflows/build.yml: windows-latest + ubuntu-22.04) -
# тоді uv сам підбере версії, сумісні з усіма ними одразу (для
# pyqt5-qt5 це означає відкат до 5.15.2 - останньої версії з
# Windows-колесами).
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
