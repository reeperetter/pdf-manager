[project]
name = "pdf-ocr-translator"
version = "1.0.0"
description = "OCR and translate PDF files using Tesseract and Deep Translator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deep-translator>=1.11.4",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
    "PyQt5>=5.15.11",
]
